<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viet Hoang — Design Portfolio</title>
  <meta name="description" content="Product designer crafting thoughtful digital experiences. Portfolio coming soon.">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Info panel — top-left, out of the way -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>Under construction</span>
      </div>
      <h1 class="panel-name">Viet Hoang</h1>
      <p class="panel-role">Product Designer</p>
    </div>
    <p class="panel-desc">
      Building a portfolio that's not a template. Check back soon.
    </p>
    <div class="panel-links">
      <a href="mailto:hello@vietnhoang.com" class="link-btn">Say hello</a>
      <a href="https://linkedin.com/in/vietnhoang" target="_blank" rel="noopener" class="link-btn link-btn--ghost">LinkedIn</a>
    </div>
  </div>

  <!-- Controls — top-right -->
  <div class="controls" id="controls">
    <button class="ctrl-btn" id="resetBtn" aria-label="Clear the platform" title="Clear the platform">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3M3.4 3.4l2.1 2.1M10.5 10.5l2.1 2.1M12.6 3.4l-2.1 2.1M5.5 10.5l-2.1 2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="8" cy="8" r="1.6" fill="currentColor"/>
      </svg>
      Clear
    </button>
    <button class="ctrl-btn" id="codexBtn" aria-label="Open your collection" title="Collection">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M3 2.5h7.5A2.5 2.5 0 0 1 13 5v8.5a1 1 0 0 0-1-1H3V2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M3 12.5V14h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span id="codexBadge">0/13</span>
    </button>
    <button class="ctrl-btn ctrl-btn--icon" id="postcardBtn" aria-label="Save a postcard of your build" title="Save a postcard">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="3.5" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="8" cy="8.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5.5 3.5 6.5 2h3l1 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="ctrl-btn ctrl-btn--icon" id="soundBtn" aria-label="Toggle sound" title="Sound">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M2.5 6v4h2.8L9 13V3L5.3 6H2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path class="snd-waves" d="M11 6c.8.7.8 3.3 0 4M12.7 4.5c1.5 1.5 1.5 5.5 0 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path class="snd-slash" d="M2.5 13.5 13.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Colour swatches — unfold above the hotbar while the colour slot is
       selected. Buttons are built by game.js from the block palette. -->
  <div class="swatches" id="swatches" role="toolbar" aria-label="Block colours"></div>

  <!-- Hotbar — block palette, bottom-center -->
  <div class="hotbar" id="hotbar" role="toolbar" aria-label="Block types">
    <button class="slot selected" data-type="color" aria-label="Color block (1)">
      <canvas class="slot-icon" width="64" height="64" aria-hidden="true"></canvas>
      <span class="slot-key">1</span>
    </button>
    <button class="slot" data-type="grass" aria-label="Grass block (2)">
      <canvas class="slot-icon" width="64" height="64" aria-hidden="true"></canvas>
      <span class="slot-key">2</span>
    </button>
    <button class="slot" data-type="lamp" aria-label="Lamp block (3)">
      <canvas class="slot-icon" width="64" height="64" aria-hidden="true"></canvas>
      <span class="slot-key">3</span>
    </button>
    <button class="slot" data-type="glass" aria-label="Glass block (4)">
      <canvas class="slot-icon" width="64" height="64" aria-hidden="true"></canvas>
      <span class="slot-key">4</span>
    </button>
  </div>

  <!-- Codex: the collection panel -->
  <div class="codex" id="codex" role="dialog" aria-label="Monument collection" hidden>
    <div class="codex-header">
      <div class="codex-title">Monuments</div>
      <div class="codex-count" id="codexCount"></div>
      <button class="codex-close" id="codexClose" aria-label="Close collection">×</button>
    </div>
    <div class="codex-list" id="codexList"></div>
  </div>

  <!-- Monument discovery card -->
  <div class="monument-card" id="monumentCard" role="status" aria-live="polite">
    <div class="mc-title" id="mcTitle"></div>
    <div class="mc-sub" id="mcSub"></div>
  </div>

  <!-- Hint -->
  <div class="hint" id="hint">Click to place blocks · Drag to move · Some shapes become monuments</div>

  <script src="engine.js"></script>
  <script src="world.js"></script>
  <script src="fx.js"></script>
  <script src="sfx.js"></script>
  <script src="monuments.js"></script>
  <script src="game.js"></script>
</body>
</html>
